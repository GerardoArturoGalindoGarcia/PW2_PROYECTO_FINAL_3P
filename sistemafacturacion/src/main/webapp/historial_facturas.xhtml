<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Historial de Facturas</title>
    <style>
        .resumen-row td { padding: 6px 12px; }
        .resumen-label { font-weight: bold; text-align: right; }
        .resumen-valor { text-align: right; min-width: 120px; }
        .factura-header-grid td { padding: 4px 10px; }
    </style>
</h:head>

<h:body>

    <div style="padding:20px;">

        <p:toolbar style="margin-bottom:16px;">
            <p:toolbarGroup>
                <span style="font-size:22px;font-weight:bold;">
                    <i class="pi pi-history"></i>
                    Historial de Facturas
                </span>
            </p:toolbarGroup>
            <p:toolbarGroup>
                <p:button value="Facturas" icon="pi pi-file" outcome="facturas" style="margin-right:8px;"/>
                <p:button value="Inicio" icon="pi pi-home" outcome="inicio" severity="secondary"/>
            </p:toolbarGroup>
        </p:toolbar>

        <h:form id="formHistorial">

            <p:messages id="messages" showDetail="true" closable="true"/>

            <p:card>
                <f:facet name="title">
                    <span><i class="pi pi-list"></i> Facturas Registradas</span>
                </f:facet>

                <p:dataTable
                        id="tablaFacturas"
                        value="#{facturaBean.listaFacturas}"
                        var="f"
                        paginator="true"
                        rows="10"
                        rowsPerPageTemplate="5,10,15,20"
                        paginatorPosition="bottom"
                        stripedRows="true"
                        showGridlines="true"
                        reflow="true"
                        sortMode="single"
                        emptyMessage="No hay facturas registradas."
                        filterDisplay="row">

                    <p:column headerText="N° Factura" sortBy="#{f.numeroFactura}" filterBy="#{f.numeroFactura}" filterMatchMode="contains" style="width:110px;">
                        <h:outputText value="#{f.numeroFactura}"/>
                    </p:column>

                    <p:column headerText="CAI" sortBy="#{f.cai}" filterBy="#{f.cai}" filterMatchMode="contains">
                        <h:outputText value="#{f.cai}" style="font-size:11px;"/>
                    </p:column>

                    <p:column headerText="Fecha" sortBy="#{f.fechaFactura}" style="width:140px;">
                        <h:outputText value="#{f.fechaFacturaFormateada}"/>
                    </p:column>

                    <p:column headerText="Cliente" sortBy="#{f.nombreCliente}" filterBy="#{f.nombreCliente}" filterMatchMode="contains">
                        <h:outputText value="#{empty f.nombreCliente ? 'Sin registro' : f.nombreCliente}"/>
                    </p:column>

                    <p:column headerText="Subtotal" sortBy="#{f.subtotal}" style="width:120px;text-align:right;">
                        <h:outputText value="#{f.subtotal}">
                            <f:convertNumber pattern="'L' #,##0.00"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Desc. %" sortBy="#{f.descuento}" style="width:90px;text-align:right;">
                        <h:outputText value="#{f.descuento}">
                            <f:convertNumber pattern="#,##0.00'%'"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="ISV (15%)" style="width:120px;text-align:right;">
                        <h:outputText value="#{f.montoISV}">
                            <f:convertNumber pattern="'L' #,##0.00"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Total" sortBy="#{f.total}" style="width:120px;text-align:right;">
                        <h:outputText value="#{f.total}" style="font-weight:bold;">
                            <f:convertNumber pattern="'L' #,##0.00"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Detalle" style="width:90px;text-align:center;">
                        <p:commandButton
                                icon="pi pi-eye"
                                title="Ver detalle"
                                action="#{facturaBean.obtenerDetalles}"
                                update=":formHistorial:dialogDetalle"
                                oncomplete="PF('dlgDetalle').show()"
                                styleClass="ui-button-rounded ui-button-text">
                            <f:setPropertyActionListener
                                    target="#{facturaBean.facturaSeleccionada}"
                                    value="#{f}"/>
                        </p:commandButton>
                    </p:column>

                </p:dataTable>
            </p:card>


            <!-- ================================ -->
            <!-- DIALOG DETALLE                   -->
            <!-- ================================ -->

            <p:dialog
                    id="dialogDetalle"
                    widgetVar="dlgDetalle"
                    header="Detalle de Factura"
                    modal="true"
                    responsive="true"
                    width="750"
                    closable="true">

                <h:panelGroup rendered="#{not empty facturaBean.facturaSeleccionada}">

                    <!-- Encabezado de la factura -->
                    <p:panelGrid columns="4" layout="grid"
                                 style="width:100%;margin-bottom:16px;"
                                 styleClass="ui-panelgrid-blank">
                        <p:outputLabel value="N° Factura:" style="font-weight:bold;"/>
                        <h:outputText value="#{facturaBean.facturaSeleccionada.numeroFactura}"/>
                        <p:outputLabel value="Fecha:" style="font-weight:bold;"/>
                        <h:outputText value="#{facturaBean.facturaSeleccionada.fechaFacturaFormateada}"/>
                        <p:outputLabel value="Cliente:" style="font-weight:bold;"/>
                        <h:outputText value="#{empty facturaBean.facturaSeleccionada.nombreCliente ? 'Sin registro' : facturaBean.facturaSeleccionada.nombreCliente}"/>
                        <p:outputLabel value="CAI:" style="font-weight:bold;"/>
                        <h:outputText value="#{facturaBean.facturaSeleccionada.cai}" style="font-size:11px;"/>
                    </p:panelGrid>

                    <p:divider/>

                    <!-- Productos -->
                    <p:dataTable
                            value="#{facturaBean.detalleActual}"
                            var="d"
                            stripedRows="true"
                            showGridlines="true"
                            emptyMessage="Sin productos."
                            style="margin-bottom:16px;">

                        <p:column headerText="Producto">
                            <h:outputText value="#{empty d.nombreProducto ? d.idProducto : d.nombreProducto}"/>
                        </p:column>

                        <p:column headerText="Cantidad" style="width:90px;text-align:center;">
                            <h:outputText value="#{d.cantidad}"/>
                        </p:column>

                        <p:column headerText="Precio Unit." style="width:130px;text-align:right;">
                            <h:outputText value="#{d.precioUnitario}">
                                <f:convertNumber pattern="'L' #,##0.00"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Subtotal" style="width:130px;text-align:right;">
                            <h:outputText value="#{d.subtotal}">
                                <f:convertNumber pattern="'L' #,##0.00"/>
                            </h:outputText>
                        </p:column>

                    </p:dataTable>

                    <p:divider/>

                    <!-- Resumen financiero -->
                    <table style="width:100%;border-collapse:collapse;" class="resumen-row">
                        <tr>
                            <td class="resumen-label">Subtotal:</td>
                            <td class="resumen-valor">
                                <h:outputText value="#{facturaBean.facturaSeleccionada.subtotal}">
                                    <f:convertNumber pattern="'L' #,##0.00"/>
                                </h:outputText>
                            </td>
                        </tr>
                        <tr>
                            <td class="resumen-label">Descuento (#{facturaBean.facturaSeleccionada.descuento}%):</td>
                            <td class="resumen-valor" style="color:#e74c3c;">
                                - <h:outputText value="#{facturaBean.facturaSeleccionada.montoDescuento}">
                                    <f:convertNumber pattern="'L' #,##0.00"/>
                                </h:outputText>
                            </td>
                        </tr>
                        <tr>
                            <td class="resumen-label">ISV (#{facturaBean.facturaSeleccionada.impuesto}%):</td>
                            <td class="resumen-valor">
                                <h:outputText value="#{facturaBean.facturaSeleccionada.montoISV}">
                                    <f:convertNumber pattern="'L' #,##0.00"/>
                                </h:outputText>
                            </td>
                        </tr>
                        <tr style="border-top:2px solid #333;">
                            <td class="resumen-label" style="font-size:16px;">Total:</td>
                            <td class="resumen-valor" style="font-size:16px;font-weight:bold;">
                                <h:outputText value="#{facturaBean.facturaSeleccionada.total}">
                                    <f:convertNumber pattern="'L' #,##0.00"/>
                                </h:outputText>
                            </td>
                        </tr>
                    </table>

                </h:panelGroup>

            </p:dialog>

        </h:form>

    </div>

</h:body>
</html>
