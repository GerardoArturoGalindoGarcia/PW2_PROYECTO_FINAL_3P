<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Gestión de Facturas</title>
    <h:outputStylesheet name="css/bootstrap.min.css"/>
</h:head>

<h:body>
    <div class="navbar" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 15px 30px; color: white;">
        <h:link value="← Volver a Inicio" outcome="inicio" style="color: white; text-decoration: none; font-weight: bold;"/>
    </div>
    
    <div class="container" style="padding: 30px;">
        <h1>Gestión de Facturas</h1>
        
        <h:form id="formFactura">
            <p:messages id="messages" showDetail="true" closable="true"/>
            
            <p:panel header="Crear Nueva Factura" styleClass="card" style="margin-bottom: 20px;">
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label>Número Factura:</label>
                        <!-- Número autocompletado desde CAI activo (solo lectura) -->
                        <p:inputNumber value="#{facturaBean.numeroFactura}" disabled="true"/>
                    </div>
                    <div class="form-group col-md-4">
                        <label>CAI:</label>
                        <p:inputText value="#{facturaBean.caiActivo.cai}" disabled="true"/>
                    </div>
                    <div class="form-group col-md-4">
                        <label>Vencimiento CAI:</label>
                        <p:inputText value="#{facturaBean.caiActivo.fechaVencimiento}" disabled="true"/>
                    </div>
                </div>

                <div class="form-row" style="margin-top:10px;">
                    <div class="form-group col-md-6">
                        <label>Cliente (autocomplete):</label>
                        <p:autoComplete value="#{facturaBean.clienteSeleccionado}" completeMethod="#{facturaBean.completarClientes}" var="c"
                                                                itemLabel="#{c.nombre}" itemValue="#{c}" forceSelection="false"/>
                        <p:inputText value="#{facturaBean.clienteNoRegistradoNombre}" placeholder="Nombre si no está registrado"/>
                    </div>
                    <div class="form-group col-md-3">
                        <label>Descuento (%):</label>
                        <p:inputNumber value="#{facturaBean.descuento}" decimalPlaces="2">
                            <p:ajax event="change" listener="#{facturaBean.onValoresFinancierosChange}" update="subtotal total"/>
                        </p:inputNumber>
                    </div>
                    <div class="form-group col-md-3">
                        <label>Impuesto (%):</label>
                        <p:inputNumber value="#{facturaBean.impuesto}" decimalPlaces="2">
                            <p:ajax event="change" listener="#{facturaBean.onValoresFinancierosChange}" update="subtotal total"/>
                        </p:inputNumber>
                    </div>
                </div>

                <h:panelGroup>
                    <h3>Agregar Producto</h3>
                    <div class="form-row">
                        <div class="form-group col-md-5">
                            <p:autoComplete value="#{facturaBean.productoSeleccionado}" completeMethod="#{facturaBean.completarProductos}" var="p"
                                                                        itemLabel="#{p.nombre}" itemValue="#{p}" forceSelection="true"/>
                        </div>
                        <div class="form-group col-md-2">
                            <p:inputNumber value="#{facturaBean.cantidadLinea}" minValue="1"/>
                        </div>
                        <div class="form-group col-md-3">
                            <p:inputNumber value="#{facturaBean.precioUnitarioLinea}" symbol="$" decimalPlaces="2"/>
                        </div>
                        <div class="form-group col-md-2">
                            <p:commandButton value="Agregar" actionListener="#{facturaBean.agregarLinea}" update="detalleTable subtotal total messages"/>
                        </div>
                    </div>
                </h:panelGroup>

                <p:dataTable id="detalleTable" value="#{facturaBean.detalleActual}" var="d" editable="true" style="margin-top:10px;">
                    <p:column headerText="Producto">
                        <h:outputText value="#{d.idProducto}"/>
                    </p:column>
                    <p:column headerText="Cantidad">
                        <h:outputText value="#{d.cantidad}"/>
                    </p:column>
                    <p:column headerText="Precio Unitario">
                        <h:outputText value="#{d.precioUnitario}">
                            <f:convertNumber pattern="$#,##0.00"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Subtotal">
                        <h:outputText value="#{d.subtotal}">
                            <f:convertNumber pattern="$#,##0.00"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Acciones">
                        <p:commandButton value="Eliminar" actionListener="#{facturaBean.eliminarLinea(d)}" update="detalleTable subtotal total messages"/>
                    </p:column>
                </p:dataTable>

                <div style="margin-top:10px; text-align:right;">
                    <label>Subtotal:</label>
                    <p:inputNumber id="subtotal" value="#{facturaBean.subtotal}" symbol="$" decimalPlaces="2" disabled="true"/>
                    <label>Total:</label>
                    <p:inputNumber id="total" value="#{facturaBean.total}" symbol="$" decimalPlaces="2" disabled="true"/>
                </div>

                <p:commandButton value="Crear Factura" actionListener="#{facturaBean.crearFactura()}" update="messages" icon="pi pi-plus" style="margin-top:10px;"/>
                <p:commandButton value="Guardar" actionListener="#{facturaBean.guardarFactura()}" update=":formFactura:messages,:formFactura:dataTableFacturas" icon="pi pi-save" style="margin-left: 10px; margin-top:10px;"/>
            </p:panel>
            
            <p:dataTable id="dataTableFacturas" value="#{facturaBean.listaFacturas}" var="factura"
                        scrollable="true" style="margin-top: 20px;" paginator="true" rows="10">
                
                <p:column headerText="ID" sortBy="#{factura.idFactura}">
                    <h:outputText value="#{factura.idFactura}"/>
                </p:column>
                
                <p:column headerText="Número" sortBy="#{factura.numeroFactura}">
                    <h:outputText value="#{factura.numeroFactura}"/>
                </p:column>
                
                <p:column headerText="CAI">
                    <h:outputText value="#{factura.cai}"/>
                </p:column>
                
                <p:column headerText="Fecha">
                    <h:outputText value="#{factura.fechaFactura}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                    </h:outputText>
                </p:column>
                
                <p:column headerText="Total">
                    <h:outputText value="#{factura.total}">
                        <f:convertNumber pattern="$#,##0.00"/>
                    </h:outputText>
                </p:column>
                
                <p:column headerText="Acciones" style="width:150px;">
                    <p:commandButton value="Ver" icon="pi pi-eye" style="margin-right: 5px;"/>
                    <p:commandButton value="PDF" icon="pi pi-download"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </div>
</h:body>
</html>
