<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

<h:head>

    <title>Gestión de Productos</title>

</h:head>

<h:body>

    <div style="padding: 20px;">

        <!-- ========================= -->
        <!-- ENCABEZADO -->
        <!-- ========================= -->

        <p:toolbar>

            <p:toolbarGroup>

                <span style="font-size: 22px; font-weight: bold;">

                    <i class="pi pi-box"></i>

                    Gestión de Productos

                </span>

            </p:toolbarGroup>


            <p:toolbarGroup>

                <p:button
                        value="Volver a Inicio"
                        icon="pi pi-home"
                        outcome="inicio"
                        severity="secondary"/>

            </p:toolbarGroup>

        </p:toolbar>


        <br/>


        <!-- ========================= -->
        <!-- FORMULARIO -->
        <!-- ========================= -->

        <h:form id="formProducto">

            <p:messages
                    id="messages"
                    showDetail="true"
                    closable="true"/>


            <p:card>

                <div style="font-size: 18px; font-weight: bold; margin-bottom: 20px;">

                    <i class="pi pi-box"></i>

                    Agregar / Editar Producto

                </div>


                <p:panelGrid
                        columns="2"
                        layout="grid"
                        style="width:100%;">

                    <p:outputLabel
                            for="nombre"
                            value="Nombre"/>

                    <p:inputText
                            id="nombre"
                            value="#{productoBean.nombre}"
                            required="true"
                            requiredMessage="El nombre del producto es requerido"
                            placeholder="Ingrese el nombre del producto"
                            style="width:100%"/>

                    <p:outputLabel
                            for="descripcion"
                            value="Descripción"/>

                    <p:inputTextarea
                            id="descripcion"
                            value="#{productoBean.descripcion}"
                            rows="3"
                            autoResize="false"
                            placeholder="Ingrese una descripción del producto"
                            style="width:100%"/>

                    <p:outputLabel
                            for="precioVenta"
                            value="Precio de Venta"/>

                    <p:inputNumber
                            id="precioVenta"
                            value="#{productoBean.precioVenta}"
                            symbol="L "
                            symbolPosition="p"
                            decimalPlaces="2"
                            minValue="0"
                            required="true"
                            requiredMessage="El precio de venta es requerido"
                            placeholder="Ingrese el precio de venta"
                            style="width:100%"/>

                    <p:outputLabel
                            for="stock"
                            value="Stock"/>

                    <p:inputNumber
                            id="stock"
                            value="#{productoBean.stock}"
                            decimalPlaces="0"
                            minValue="0"
                            required="true"
                            requiredMessage="El stock es requerido"
                            placeholder="Ingrese el stock"
                            style="width:100%"/>

                </p:panelGrid>


                <p:divider/>


                <!-- BOTONES -->

                <p:commandButton
                        value="#{productoBean.productoSeleccionado != null ? 'Actualizar Producto' : 'Guardar Producto'}"
                        icon="#{productoBean.productoSeleccionado != null ? 'pi pi-pencil' : 'pi pi-save'}"
                        action="#{productoBean.guardarOActualizarProducto}"
                        process="@form"
                        update="messages formProducto dataTableProductos"/>


                <p:commandButton
                        value="Limpiar"
                        icon="pi pi-refresh"
                        action="#{productoBean.limpiarFormulario}"
                        process="@this"
                        update="formProducto"
                        immediate="true"
                        severity="secondary"
                        style="margin-left:10px"/>

            </p:card>


            <br/>


            <!-- ========================= -->
            <!-- TABLA -->
            <!-- ========================= -->

            <p:card>

                <div style="font-size: 18px; font-weight: bold; margin-bottom: 20px;">

                    <i class="pi pi-list"></i>

                    Productos Registrados

                </div>


                <p:dataTable
                        id="dataTableProductos"
                        value="#{productoBean.listaProductos}"
                        var="producto"
                        paginator="true"
                        rows="10"
                        rowsPerPageTemplate="5,10,15,20"
                        paginatorPosition="bottom"
                        stripedRows="true"
                        showGridlines="true"
                        reflow="true"
                        emptyMessage="No hay productos registrados.">


                    <!-- ID -->

                    <p:column
                            headerText="ID"
                            sortBy="#{producto.idProducto}"
                            style="width:80px">

                        <h:outputText
                                value="#{producto.idProducto}"/>

                    </p:column>


                    <!-- NOMBRE -->

                    <p:column
                            headerText="Nombre"
                            sortBy="#{producto.nombre}">

                        <h:outputText
                                value="#{producto.nombre}"/>

                    </p:column>


                    <!-- DESCRIPCIÓN -->

                    <p:column
                            headerText="Descripción">

                        <h:outputText
                                value="#{producto.descripcion}"/>

                    </p:column>


                    <!-- PRECIO -->

                    <p:column
                            headerText="Precio de Venta"
                            sortBy="#{producto.precioVenta}">

                        <h:outputText
                                value="#{producto.precioVenta}">

                            <f:convertNumber
                                    pattern="L #,##0.00"/>

                        </h:outputText>

                    </p:column>


                    <!-- STOCK -->

                    <p:column
                            headerText="Stock"
                            sortBy="#{producto.stock}"
                            style="text-align:center">

                        <p:tag
                                value="#{producto.stock}"
                                severity="#{producto.stock == 0 ? 'danger' : producto.stock == 5 ? 'warn' : 'success'}"/>

                    </p:column>


                    <!-- ACCIONES -->

                    <p:column
                            headerText="Acciones"
                            style="width:150px; text-align:center">


                        <!-- EDITAR -->

                        <p:commandButton
                                icon="pi pi-pencil"
                                title="Editar"
                                action="#{productoBean.seleccionarProducto(producto)}"
                                update="formProducto"
                                process="@this"
                                styleClass="ui-button-rounded ui-button-text"
                                style="margin-right:5px"/>


                        <!-- ELIMINAR -->

                        <p:commandButton
                                icon="pi pi-trash"
                                title="Eliminar"
                                action="#{productoBean.prepararYEliminarProducto(producto)}"
                                process="@this"
                                update="messages dataTableProductos formProducto"
                                styleClass="ui-button-rounded ui-button-text ui-button-danger">

                            <p:confirm
                                    header="Confirmar eliminación"
                                    message="¿Está seguro de que desea eliminar este producto?"
                                    icon="pi pi-exclamation-triangle"/>

                        </p:commandButton>

                    </p:column>

                </p:dataTable>

            </p:card>

        </h:form>

        <p:confirmDialog global="true">

            <p:commandButton
                    value="Sí, eliminar"
                    type="button"
                    styleClass="ui-confirmdialog-yes"
                    icon="pi pi-check"/>

            <p:commandButton
                    value="Cancelar"
                    type="button"
                    styleClass="ui-confirmdialog-no"
                    icon="pi pi-times"
                    severity="secondary"/>

        </p:confirmDialog>

    </div>

</h:body>
</html>
