<!DOCTYPE html>
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">

<h:head>
    <title>Sistema de Facturación - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
        }

        .login-title {
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: bold;
        }

        .login-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .login-button {
            width: 100%;
            margin-top: 10px;
        }

        .message {
            margin-bottom: 20px;
        }
    </style>
</h:head>

<h:body>

    <div class="login-container">

        <div class="login-card">

            <p:card>

                <f:facet name="title">
                    <div class="login-title">
                        Sistema de Facturación
                    </div>
                </f:facet>

                <f:facet name="subtitle">
                    <div class="login-subtitle">
                        Inicie sesión para continuar
                    </div>
                </f:facet>

                <h:form id="loginForm">

                    <p:messages
                            id="messages"
                            showDetail="true"
                            closable="true"
                            styleClass="message"/>

                    <div class="field">

                        <p:outputLabel
                                for="usuario"
                                value="Usuario"/>

                        <p:inputText
                                id="usuario"
                                value="#{loginBean.nombreUsuario}"
                                required="true"
                                requiredMessage="El usuario es requerido"
                                placeholder="Ingrese su usuario"
                                style="width:100%"/>

                    </div>

                    <div class="field">

                        <p:outputLabel
                                for="contrasena"
                                value="Contraseña"/>

                        <p:password
                                id="contrasena"
                                value="#{loginBean.contrasena}"
                                required="true"
                                requiredMessage="La contraseña es requerida"
                                placeholder="Ingrese su contraseña"
                                feedback="false"
                                toggleMask="true"
                                style="width:100%"/>

                    </div>

                    <p:commandButton
                            value="Iniciar Sesión"
                            icon="pi pi-sign-in"
                            action="#{loginBean.autenticar}"
                            process="@form"
                            update="messages"
                            styleClass="login-button"/>

                </h:form>

            </p:card>

        </div>

    </div>

</h:body>
</html>
