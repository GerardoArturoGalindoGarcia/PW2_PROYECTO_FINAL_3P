<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<head>
    <title>Gestión de Facturas</title>
    <h:outputStylesheet name="css/bootstrap.min.css"/>
</head>

<body>
    <div class="navbar" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 15px 30px; color: white;">
        <h:link value="← Volver a Inicio" outcome="inicio" style="color: white; text-decoration: none; font-weight: bold;"/>
    </div>
    
    <div class="container" style="padding: 30px;">
        <h1>Gestión de Facturas</h1>
        
        <h:form id="formFactura">
            <p:messages id="messages" showDetail="true" closable="true"/>
            
            <p:panel header="Crear Nueva Factura" styleClass="card" style="margin-bottom: 20px;">
                <div class="form-group">
                    <label>Número Factura:</label>
                    <p:inputNumber value="#{facturaBean.numeroFactura}" required="true"/>
                </div>
                <div class="form-group">
                    <label>Subtotal:</label>
                    <p:inputNumber value="#{facturaBean.subtotal}" symbol="$" decimalPlaces="2"/>
                </div>
                <div class="form-group">
                    <label>Descuento (%):</label>
                    <p:inputNumber value="#{facturaBean.descuento}" decimalPlaces="2"/>
                </div>
                <div class="form-group">
                    <label>Impuesto (%):</label>
                    <p:inputNumber value="#{facturaBean.impuesto}" decimalPlaces="2"/>
                </div>
                
                <p:commandButton value="Crear Factura" actionListener="#{facturaBean.crearFactura()}"
                                update="messages" icon="pi pi-plus"/>
                <p:commandButton value="Guardar" actionListener="#{facturaBean.guardarFactura()}"
                                update="messages,dataTableFacturas" icon="pi pi-save" style="margin-left: 10px;"/>
            </p:panel>
            
            <p:dataTable id="dataTableFacturas" value="#{facturaBean.listaFacturas}" var="factura"
                        scrollable="true" style="margin-top: 20px;" paginator="true" rows="10">
                
                <p:column headerText="ID" sortBy="#{factura.idFactura}">
                    <h:outputText value="#{factura.idFactura}"/>
                </p:column>
                
                <p:column headerText="Número" sortBy="#{factura.numeroFactura}">
                    <h:outputText value="#{factura.numeroFactura}"/>
                </p:column>
                
                <p:column headerText="CAI">
                    <h:outputText value="#{factura.cai}"/>
                </p:column>
                
                <p:column headerText="Fecha">
                    <h:outputText value="#{factura.fechaFactura}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                    </h:outputText>
                </p:column>
                
                <p:column headerText="Total">
                    <h:outputText value="#{factura.total}">
                        <f:convertNumber pattern="$#,##0.00"/>
                    </h:outputText>
                </p:column>
                
                <p:column headerText="Acciones" style="width:150px;">
                    <p:commandButton value="Ver" icon="pi pi-eye" style="margin-right: 5px;"/>
                    <p:commandButton value="PDF" icon="pi pi-download"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </div>
</body>
</html>
