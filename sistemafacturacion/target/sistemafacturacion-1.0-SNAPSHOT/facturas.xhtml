<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>

    <title>Gestión de Facturas</title>

</h:head>

<h:body>

    <div style="padding:20px;">

        <!-- ========================= -->
        <!-- BARRA SUPERIOR -->
        <!-- ========================= -->

        <p:toolbar>

            <p:toolbarGroup>

            <span style="font-size:22px;font-weight:bold;">

                <i class="pi pi-receipt"></i>

                Gestión de Facturas

            </span>

            </p:toolbarGroup>

            <p:toolbarGroup>

                <p:button
                        value="Historial Facturas"
                        icon="pi pi-history"
                        outcome="historial_facturas"
                        severity="contrast"
                        style="margin-right:10px;"/>

                <p:button
                        value="Volver a Inicio"
                        icon="pi pi-home"
                        outcome="inicio"
                        severity="secondary"/>

            </p:toolbarGroup>

        </p:toolbar>


        <h:form id="formFactura">

            <!-- MENSAJES -->

            <p:messages
                    id="messages"
                    showDetail="true"
                    closable="true"/>


            <!-- ========================= -->
            <!-- CREAR FACTURA -->
            <!-- ========================= -->

            <p:card style="margin-top:20px;">

                <f:facet name="title">

                <span>

                    <i class="pi pi-file-plus"></i>

                    Crear Nueva Factura

                </span>

                </f:facet>


                <!-- INFORMACIÓN DE FACTURA -->

                <p:panelGrid
                        columns="2"
                        layout="grid"
                        style="width:100%;">

                    <p:outputLabel
                            for="numeroFactura"
                            value="Número Factura"/>

                    <p:inputNumber
                            id="numeroFactura"
                            value="#{facturaBean.numeroFactura}"
                            disabled="true"/>


                    <p:outputLabel
                            for="cai"
                            value="CAI"/>

                    <p:inputText
                            id="cai"
                            value="#{facturaBean.caiActivo.cai}"
                            disabled="true"/>


                    <p:outputLabel
                            for="vencimientoCAI"
                            value="Vencimiento CAI"/>

                    <p:inputText
                            id="vencimientoCAI"
                            value="#{facturaBean.caiActivo.fechaVencimiento}"
                            disabled="true"/>

                </p:panelGrid>


                <p:divider/>


                <!-- ========================= -->
                <!-- CLIENTE -->
                <!-- ========================= -->

                <p:panelGrid
                        columns="2"
                        layout="grid"
                        style="width:100%;">

                    <p:outputLabel
                            for="cliente"
                            value="Cliente"/>

                    <p:autoComplete
                            id="cliente"
                            value="#{facturaBean.clienteSeleccionado}"
                            completeMethod="#{facturaBean.completarClientes}"
                            var="c"
                            itemLabel="#{c.nombre}"
                            itemValue="#{c}"
                            forceSelection="false"
                            dropdown="true"/>


                    <p:outputLabel
                            for="clienteNoRegistrado"
                            value="Cliente no registrado"/>

                    <p:inputText
                            id="clienteNoRegistrado"
                            value="#{facturaBean.clienteNoRegistradoNombre}"
                            placeholder="Nombre si no está registrado"/>


                    <p:outputLabel
                            for="descuento"
                            value="Descuento (%)"/>

                    <p:inputNumber
                            id="descuento"
                            value="#{facturaBean.descuento}"
                            minValue="0"
                            maxValue="100"
                            decimalPlaces="2"
                            symbol="%">

                        <p:ajax
                                event="change"
                                listener="#{facturaBean.onValoresFinancierosChange}"
                                update="subtotal total"/>

                    </p:inputNumber>


                    <p:outputLabel
                            for="impuesto"
                            value="Impuesto (%)"/>

                    <p:inputNumber
                            id="impuesto"
                            value="#{facturaBean.impuesto}"
                            minValue="15"
                            maxValue="15"
                            decimalPlaces="2"
                            symbol="%"
                            disabled="true"/>

                </p:panelGrid>


                <p:divider/>


                <!-- ========================= -->
                <!-- AGREGAR PRODUCTO -->
                <!-- ========================= -->

                <h3 style="margin-top:0;">

                    <i class="pi pi-box"></i>

                    Agregar Producto

                </h3>


                <p:panelGrid
                        columns="2"
                        layout="grid"
                        style="width:100%;">

                    <p:outputLabel
                            for="producto"
                            value="Producto"/>

                    <p:autoComplete
                            id="producto"
                            value="#{facturaBean.productoSeleccionado}"
                            completeMethod="#{facturaBean.completarProductos}"
                            converter="productoConverter"
                            var="p"
                            itemLabel="#{p.nombre}"
                            itemValue="#{p}"
                            forceSelection="true"
                            dropdown="true">

                        <p:ajax
                                event="itemSelect"
                                listener="#{facturaBean.onProductoSelect}"
                                update="precioUnitario"/>

                    </p:autoComplete>


                    <p:outputLabel
                            for="cantidad"
                            value="Cantidad"/>

                    <p:inputNumber
                            id="cantidad"
                            value="#{facturaBean.cantidadLinea}"
                            minValue="1"
                            decimalPlaces="0"/>


                    <p:outputLabel
                            for="precioUnitario"
                            value="Precio Unitario"/>

                    <p:inputNumber
                            id="precioUnitario"
                            value="#{facturaBean.precioUnitarioLinea}"
                            symbol="L "
                            decimalPlaces="2"/>


                    <p:outputLabel value=""/>

                    <p:commandButton
                            id="btnAgregarProducto"
                            value="Agregar Producto"
                            icon="pi pi-plus"
                            action="#{facturaBean.agregarLinea}"
                            process="@this producto cantidad"
                            update="detalleTable subtotal total precioUnitario messages"
                            style="margin-top:10px;"/>

                </p:panelGrid>


                <p:divider/>


                <!-- ========================= -->
                <!-- DETALLE -->
                <!-- ========================= -->

                <div style="font-size:20px;font-weight:bold;margin-bottom:20px;">

                    <i class="pi pi-list"></i>

                    Detalle de Factura

                </div>


                <p:dataTable
                        id="detalleTable"
                        value="#{facturaBean.detalleActual}"
                        var="d"
                        stripedRows="true"
                        showGridlines="true"
                        reflow="true"
                        emptyMessage="No hay productos agregados."
                        style="margin-top:10px;">

                    <p:column headerText="Producto">

                        <h:outputText
                                value="#{empty d.nombreProducto ? d.idProducto : d.nombreProducto}"/>

                    </p:column>


                    <p:column headerText="Cantidad">

                        <h:outputText
                                value="#{d.cantidad}"/>

                    </p:column>


                    <p:column headerText="Precio Unitario">

                        <h:outputText
                                value="#{d.precioUnitario}">

                            <f:convertNumber
                                    pattern="'L' #,##0.00"/>

                        </h:outputText>

                    </p:column>


                    <p:column headerText="Subtotal">

                        <h:outputText
                                value="#{d.subtotal}">

                            <f:convertNumber
                                    pattern="'L' #,##0.00"/>

                        </h:outputText>

                    </p:column>


                    <p:column
                            headerText="Acciones"
                            style="text-align:center;">

                        <p:commandButton
                                icon="pi pi-trash"
                                title="Eliminar"
                                actionListener="#{facturaBean.eliminarLinea(d)}"
                                update="detalleTable subtotal total messages"
                                styleClass="ui-button-rounded ui-button-text ui-button-danger"/>

                    </p:column>

                </p:dataTable>


                <p:divider/>


                <!-- ========================= -->
                <!-- TOTALES -->
                <!-- ========================= -->

                <p:panelGrid
                        columns="2"
                        layout="grid"
                        style="width:100%;">

                    <p:outputLabel
                            for="subtotal"
                            value="Subtotal"/>

                    <p:inputNumber
                            id="subtotal"
                            value="#{facturaBean.subtotal}"
                            symbol="L "
                            decimalPlaces="2"
                            disabled="true"/>


                    <p:outputLabel
                            for="total"
                            value="Total"/>

                    <p:inputNumber
                            id="total"
                            value="#{facturaBean.total}"
                            symbol="L "
                            decimalPlaces="2"
                            disabled="true"/>

                </p:panelGrid>


                <p:divider/>


                <!-- ========================= -->
                <!-- BOTONES -->
                <!-- ========================= -->

                <p:commandButton
                        value="Crear Factura"
                        icon="pi pi-plus"
                        action="#{facturaBean.crearFactura}"
                        process="@this"
                        immediate="true"
                        update="@form"
                        style="margin-top:10px;"/>


                <p:commandButton
                        value="Guardar Factura"
                        icon="pi pi-save"
                        action="#{facturaBean.guardarFactura}"
                        process="@this cliente clienteNoRegistrado descuento"
                        update="@form dataTableFacturas messages"
                        style="margin-left:10px;margin-top:10px;"/>

            </p:card>


            <!-- ========================= -->
            <!-- FACTURAS REGISTRADAS -->
            <!-- ========================= -->

            <div style="margin-top:20px;">

                <p:card>

                    <f:facet name="title">

                    <span>

                        <i class="pi pi-list"></i>

                        Facturas Registradas

                    </span>

                    </f:facet>


                    <p:dataTable
                            id="dataTableFacturas"
                            value="#{facturaBean.listaFacturas}"
                            var="factura"
                            paginator="true"
                            rows="10"
                            rowsPerPageTemplate="5,10,15,20"
                            paginatorPosition="bottom"
                            stripedRows="true"
                            showGridlines="true"
                            reflow="true"
                            emptyMessage="No hay facturas registradas."
                            sortMode="single"
                            scrollable="true">


                        <!-- ID -->

                        <p:column
                                headerText="ID"
                                sortBy="#{factura.idFactura}"
                                style="width:80px">

                            <h:outputText
                                    value="#{factura.idFactura}"/>

                        </p:column>


                        <!-- NUMERO -->

                        <p:column
                                headerText="Número"
                                sortBy="#{factura.numeroFactura}">

                            <h:outputText
                                    value="#{factura.numeroFactura}"/>

                        </p:column>


                        <!-- CAI -->

                        <p:column
                                headerText="CAI"
                                sortBy="#{factura.cai}">

                            <h:outputText
                                    value="#{factura.cai}"/>

                        </p:column>


                        <!-- FECHA -->

                        <p:column
                                headerText="Fecha"
                                sortBy="#{factura.fechaFactura}">

                            <h:outputText
                                    value="#{factura.fechaFactura}">

                                <f:convertDateTime
                                        pattern="dd/MM/yyyy HH:mm"/>

                            </h:outputText>

                        </p:column>


                        <!-- TOTAL -->

                        <p:column
                                headerText="Total"
                                sortBy="#{factura.total}">

                            <h:outputText
                                    value="#{factura.total}">

                                <f:convertNumber
                                        pattern="'L' #,##0.00"/>

                            </h:outputText>

                        </p:column>


                        <!-- ACCIONES -->

                        <p:column
                                headerText="Acciones"
                                style="width:180px;text-align:center;">

                            <p:commandButton
                                    icon="pi pi-eye"
                                    title="Ver"
                                    action="#{facturaBean.obtenerDetalles}"
                                    update="detalleDialog"
                                    oncomplete="PF('detalleDialogWidget').show()"
                                    styleClass="ui-button-rounded ui-button-text"
                                    style="margin-right:5px;">

                                <f:setPropertyActionListener
                                        target="#{facturaBean.facturaSeleccionada}"
                                        value="#{factura}"/>

                            </p:commandButton>


                            <p:commandButton
                                    icon="pi pi-download"
                                    title="PDF"
                                    action="#{facturaBean.generarPDF}"
                                    styleClass="ui-button-rounded ui-button-text">

                                <f:setPropertyActionListener
                                        target="#{facturaBean.facturaSeleccionada}"
                                        value="#{factura}"/>

                            </p:commandButton>

                        </p:column>

                    </p:dataTable>

                </p:card>

            </div>


            <!-- ========================= -->
            <!-- DIALOG DETALLES -->
            <!-- ========================= -->

            <p:dialog
                    id="detalleDialog"
                    widgetVar="detalleDialogWidget"
                    header="Detalle de Factura"
                    modal="true"
                    responsive="true"
                    width="700">

                <p:dataTable
                        value="#{facturaBean.detalleActual}"
                        var="detalle"
                        stripedRows="true"
                        showGridlines="true"
                        emptyMessage="No hay detalles.">

                    <p:column headerText="Producto">

                        <h:outputText
                                value="#{empty detalle.nombreProducto ? detalle.idProducto : detalle.nombreProducto}"/>

                    </p:column>

                    <p:column headerText="Cantidad">

                        <h:outputText
                                value="#{detalle.cantidad}"/>

                    </p:column>

                    <p:column headerText="Precio">

                        <h:outputText
                                value="#{detalle.precioUnitario}">

                            <f:convertNumber
                                    pattern="'L' #,##0.00"/>

                        </h:outputText>

                    </p:column>

                    <p:column headerText="Subtotal">

                        <h:outputText
                                value="#{detalle.subtotal}">

                            <f:convertNumber
                                    pattern="'L' #,##0.00"/>

                        </h:outputText>

                    </p:column>

                </p:dataTable>

            </p:dialog>

        </h:form>

    </div>

</h:body>

</html>
